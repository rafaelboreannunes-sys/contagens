<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Armário</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #eef2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        input, select, button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4a90e2;
        }

        button.btn-add {
            background-color: #4a90e2;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-add:hover {
            background-color: #357abd;
        }

        .search-box {
            margin-bottom: 15px;
        }

        .lista-roupas {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-roupa {
            background-color: #f8f9fa;
            border-left: 5px solid #4a90e2;
            padding: 12px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-roupa strong {
            display: block;
            color: #333;
            font-size: 16px;
        }

        .info-roupa span {
            font-size: 12px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-delete {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-delete:hover {
            background-color: #cc0000;
        }

        .vazio {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🧥 Meu Armário</h2>

    <!-- Formulário de Cadastro -->
    <div class="form-group">
        <input type="text" id="nomeRoupa" placeholder="Nome da roupa (ex: Jaqueta de Couro)">
        <select id="categoriaRoupa">
            <option value="Camiseta / Blusa">Camiseta / Blusa</option>
            <option value="Calça / Bermuda">Calça / Bermuda</option>
            <option value="Casaco / Jaqueta">Casaco / Jaqueta</option>
            <option value="Calçado">Calçado</option>
            <option value="Acessório">Acessório</option>
        </select>
        <button class="btn-add" onclick="adicionarRoupa()">Guardar no Armário</button>
    </div>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

    <!-- Busca -->
    <input type="text" class="search-box" id="inputBusca" placeholder="🔍 Buscar roupa pelo nome..." oninput="renderizarRoupas()">

    <!-- Lista de Roupas -->
    <div id="listaRoupas" class="lista-roupas"></div>
</div>

<script>
    // Carrega do localStorage ou inicia lista vazia
    let armario = JSON.parse(localStorage.getItem('meuArmario')) || [];

    function salvar() {
        localStorage.setItem('meuArmario', JSON.stringify(armario));
    }

    function adicionarRoupa() {
        const inputNome = document.getElementById('nomeRoupa');
        const selectCategoria = document.getElementById('categoriaRoupa');

        const nome = inputNome.value.trim();
        const categoria = selectCategoria.value;

        if (!nome) {
            alert('Por favor, digite o nome da peça!');
            return;
        }

        const novaRoupa = {
            id: Date.now(),
            nome: nome,
            categoria: categoria
        };

        armario.push(novaRoupa);
        salvar();
        
        inputNome.value = '';
        renderizarRoupas();
    }

    function removerRoupa(id) {
        armario = armario.filter(item => item.id !== id);
        salvar();
        renderizarRoupas();
    }

    function renderizarRoupas() {
        const listaDiv = document.getElementById('listaRoupas');
        const termoBusca = document.getElementById('inputBusca').value.toLowerCase();

        listaDiv.innerHTML = '';

        const roupasFiltradas = armario.filter(item => 
            item.nome.toLowerCase().includes(termoBusca)
        );

        if (roupasFiltradas.length === 0) {
            listaDiv.innerHTML = '<p class="vazio">Nenhuma roupa encontrada.</p>';
            return;
        }

        roupasFiltradas.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card-roupa';
            card.innerHTML = `
                <div class="info-roupa">
                    <strong>${item.nome}</strong>
                    <span>${item.categoria}</span>
                </div>
                <button class="btn-delete" onclick="removerRoupa(${item.id})">Excluir</button>
            `;
            listaDiv.appendChild(card);
        });
    }

    // Renderiza ao abrir a página
    renderizarRoupas();
</script>

</body>
</html>
