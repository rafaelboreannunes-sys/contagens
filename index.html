<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guarda-Roupa Digital</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #218838;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 10px 12px;
            border-radius: 5px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-remove {
            background-color: #dc3545;
            padding: 5px 10px;
            font-size: 12px;
        }

        .btn-remove:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>👕 Guarda-Roupa Digital</h2>
    
    <div class="input-group">
        <input type="text" id="roupaInput" placeholder="Ex: Camiseta Azul, Calça Jeans...">
        <button onclick="adicionarRoupa()">Guardar</button>
    </div>

    <ul id="listaRoupas"></ul>
</div>

<script>
    const armario = [];

    function adicionarRoupa() {
        const input = document.getElementById('roupaInput');
        const nomeRoupa = input.value.trim();

        if (nomeRoupa === '') {
            alert('Por favor, digite o nome de uma peça de roupa!');
            return;
        }

        armario.push(nomeRoupa);
        input.value = '';
        atualizarLista();
    }

    function removerRoupa(index) {
        armario.splice(index, 1);
        atualizarLista();
    }

    function atualizarLista() {
        const lista = document.getElementById('listaRoupas');
        lista.innerHTML = '';

        armario.forEach((roupa, index) => {
            const li = document.createElement('li');
            li.innerHTML = `
                <span>${roupa}</span>
                <button class="btn-remove" onclick="removerRoupa(${index})">Remover</button>
            `;
            lista.appendChild(li);
        });
    }
</script>

</body>
</html>
